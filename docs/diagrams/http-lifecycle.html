(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><text x="812.0" y="364" class="name" text-anchor="middle">每次调用新建调查状态</text><text x="812.0" y="384" class="mono" text-anchor="middle">messages / cache / trace</text><text x="812.0" y="402" class="small" text-anchor="middle">同一次调查的工具按顺序执行</text></g><g data-node="远端 LLM API"><rect x="1016" y="176" width="216" height="80" rx="6" fill="#f5f5f5"/><rect x="1016" y="176" width="216" height="80" rx="6" fill="rgba(45,49,66,.03)" stroke="#2d3142" stroke-width="1.2"/><text x="1124.0" y="204" class="name" text-anchor="middle">远端 LLM API</text><text x="1124.0" y="224" class="mono" text-anchor="middle">messages + tools</text><text x="1124.0" y="242" class="small" text-anchor="middle">返回答案 / tool_calls</text></g><g data-node="本机证据与命令"><rect x="1016" y="480" width="216" height="80" rx="6" fill="#f5f5f5"/><rect x="1016" y="480" width="216" height="80" rx="6" fill="rgba(45,49,66,.03)" stroke="#2d3142" stroke-width="1.2"/><text x="1124.0" y="508" class="name" text-anchor="middle">本机证据与命令</text><text x="1124.0" y="528" class="mono" text-anchor="middle">fileRoot / fixed argv</text><text x="1124.0" y="546" class="small" text-anchor="middle">通过共享 ToolRegistry 取证</text></g><g data-node="序列化 Result JSON"><rect x="688" y="528" width="248" height="80" rx="6" fill="#f5f5f5"/><rect x="688" y="528" width="248" height="80" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><text x="812.0" y="556" class="name" text-anchor="middle">序列化 Result JSON</text><text x="812.0" y="576" class="mono" text-anchor="middle">answer · steps · toolCalls</text><text x="812.0" y="594" class="mono" text-anchor="middle">stopReason · trace</text></g><g data-node="finally 释放已获取的许可"><rect x="376" y="528" width="248" height="80" rx="6" fill="#f5f5f5"/><rect x="376" y="528" width="248" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="500.0" y="556" class="name" text-anchor="middle">finally 释放已获取的许可</text><text x="500.0" y="576" class="mono" text-anchor="middle">exchange.close()</text><text x="500.0" y="594" class="small" text-anchor="middle">成功、失败或校验退出均清理</text></g><text x="64" y="520" class="mono" text-anchor="start">GET /health</text><text x="64" y="544" class="small" text-anchor="start">直接返回 200 与 status:ok</text><text x="64" y="566" class="small" text-anchor="start">不占调查许可，不调用 LLM</text><text x="64" y="606" class="small" text-anchor="start">虚拟线程承载 HTTP 请求</text><text x="64" y="628" class="small" text-anchor="start">最多 4 次调查同时进行</text><line x1="40" y1="676" x2="1240" y2="676" stroke="#bfc0c0" stroke-width=".8"/><line x1="40" y1="696" x2="68" y2="696" stroke="#2e5aa8" stroke-width="1.5"/><text x="76" y="700" class="small" text-anchor="start">HTTP / LLM 数据</text><line x1="244" y1="696" x2="272" y2="696" stroke="#4f5d75" stroke-width="1.5"/><text x="280" y="700" class="small" text-anchor="start">本地取证 / 返回</text><text x="1240" y="700" class="small" text-anchor="end">请求间无持久会话；messages、cache、trace 互不共享</text></svg></main></body></html>
