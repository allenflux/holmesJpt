name: holmes-web

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: holmes-java-web:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOLMES_WEB_PASSWORD: ${HOLMES_WEB_PASSWORD:-}
      HOLMES_WEB_SECURE_COOKIE: ${HOLMES_WEB_SECURE_COOKIE:-false}
      # 容器内路径与监听地址固定，覆盖宿主机 .env 中的本地值。
      HOLMES_BIND_HOST: 0.0.0.0
      HOLMES_PORT: "8080"
      HOLMES_TOOLS_FILE: config/tools-web.json
      HOLMES_RUNBOOKS_DIR: runbooks
      # 默认线上任务 API；仅离线回放时设置容器内快照路径并另外挂载文件。
      HOLMES_LOG_TASKS_FILE: ${HOLMES_LOG_TASKS_FILE:-}
      HOLMES_SCHEDULER_URL: ${HOLMES_SCHEDULER_URL:-http://216.176.194.30:18080}
      HOLMES_SCHEDULER_TOKEN: ${HOLMES_SCHEDULER_TOKEN:-}
      HOLMES_SCHEDULER_TIMEZONE: ${HOLMES_SCHEDULER_TIMEZONE:-Asia/Hong_Kong}
      HOLMES_SCHEDULER_PAGE_SIZE: ${HOLMES_SCHEDULER_PAGE_SIZE:-500}
      HOLMES_SCHEDULER_MAX_TASKS: ${HOLMES_SCHEDULER_MAX_TASKS:-200000}
      HOLMES_SCHEDULER_TIMEOUT_SECONDS: ${HOLMES_SCHEDULER_TIMEOUT_SECONDS:-30}
      HOLMES_SCHEDULER_SCAN_SECONDS: ${HOLMES_SCHEDULER_SCAN_SECONDS:-120}
      HOLMES_LOG_FILE: ""
      HOLMES_LOG_DATA_DIR: /app/data/holmes-log
      HOLMES_LOG_MAX_EVENTS: ${HOLMES_LOG_MAX_EVENTS:-100000}
      HOLMES_LOG_MAX_BYTES: ${HOLMES_LOG_MAX_BYTES:-67108864}
      HOLMES_LOG_SPOOL_BYTES: ${HOLMES_LOG_SPOOL_BYTES:-268435456}
      HOLMES_LOG_CHUNK_BYTES: ${HOLMES_LOG_CHUNK_BYTES:-16777216}
      HOLMES_LOG_STORE_BYTES: ${HOLMES_LOG_STORE_BYTES:-104857600}
      HOLMES_LOG_REPORT_BYTES: ${HOLMES_LOG_REPORT_BYTES:-2097152}
      HOLMES_LOG_RETENTION_HOURS: ${HOLMES_LOG_RETENTION_HOURS:-168}
      HOLMES_LOG_JOB_SECONDS: ${HOLMES_LOG_JOB_SECONDS:-300}
    command: ["web", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${HOLMES_WEB_LOCAL_PORT:-8080}:8080"
    volumes:
      - type: volume
        source: app-data
        target: /app/data
      - type: bind
        source: ./config/tools-web.json
        target: /app/config/tools-web.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runbooks
        target: /app/runbooks
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: caddy:2.11.7-alpine
    profiles: [proxy]
    restart: unless-stopped
    depends_on: [app]
    environment:
      HOLMES_DOMAIN: ${HOLMES_DOMAIN:-}
      HOLMES_WEB_SECURE_COOKIE: ${HOLMES_WEB_SECURE_COOKIE:-false}
    # profile 未启用时无需域名；启用后必须同时配置域名和安全 Cookie。
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$HOLMES_DOMAIN" || { echo 'proxy 需要 HOLMES_DOMAIN'; exit 1; }
        test "$$HOLMES_WEB_SECURE_COOKIE" = true || { echo 'proxy 需要 HOLMES_WEB_SECURE_COOKIE=true'; exit 1; }
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./deploy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  app-data:
  caddy-data:
  caddy-config:
